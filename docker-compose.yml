# PostgreSQL and Kafka. Start with: docker compose up -d
# The web dashboard runs on your PC: python web_dashboard.py  ->  http://localhost:5000
# Flink (optional profile): docker compose --profile flink up -d --build
#   (run setup_airport_db.py and the producers first, so the topic and tables exist)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: flight
      POSTGRES_PASSWORD: flight
      POSTGRES_DB: flight_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flight -d flight_db"]
      interval: 5s
      retries: 20

  # Single Kafka broker in KRaft mode (no ZooKeeper).
  # Python scripts on your PC connect to localhost:9094.
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MESSAGE_MAX_BYTES: 2000000
    ports:
      - "9094:9094"

  # ---------------------------------------------------------------- Apache Flink
  jobmanager:
    profiles: ["flink"]
    build: ./docker/flink
    command: jobmanager
    ports:
      - "8081:8081"          # Flink web UI: http://localhost:8081
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        parallelism.default: 1

  taskmanager:
    profiles: ["flink"]
    build: ./docker/flink
    command: taskmanager
    depends_on: [jobmanager]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2

  # Submits flink_runway_job.py to the cluster, then exits (the job keeps running).
  flink-job:
    profiles: ["flink"]
    build: ./docker/flink
    command: flink run -d -m jobmanager:8081 -py /opt/job/flink_runway_job.py
    working_dir: /opt/job
    volumes:
      - ./:/opt/job:ro
    environment:
      FLINK_KAFKA_BROKER: kafka:9092
      FLINK_JDBC_URL: jdbc:postgresql://postgres:5432/flight_db
    depends_on: [jobmanager, taskmanager, kafka, postgres]
    restart: on-failure

volumes:
  pgdata:
